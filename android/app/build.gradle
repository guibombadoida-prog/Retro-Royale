plugins { id 'com.android.application' }
android {
    namespace 'br.com.guibomba.retroroyale'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.guibomba.retroroyale'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.5.0'
        buildConfigField 'String', 'GAME_URL', '"https://retro-royale-vfx.gabriel-divino1.chatgpt.site/game/index.html?platform=android"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
