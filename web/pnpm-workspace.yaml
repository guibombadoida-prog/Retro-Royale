# Só instala pacotes publicados há pelo menos 7 dias e só deixa rodar scripts de instalação destes pacotes.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  miniflare>sharp: 0.35.4
