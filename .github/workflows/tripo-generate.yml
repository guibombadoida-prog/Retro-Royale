name: Generate Tripo3D Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and download Tripo3D assets
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: node tools/tripo-generate.js

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/
          if git diff --cached --quiet; then
            echo "Nenhum asset novo para commitar."
            exit 0
          fi
          git commit -m "chore: add generated Tripo3D assets"
          git push
