name: Retro Royale Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retro-royale-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Com o servidor da Cloudflare no ar, o app abre ele (online completo); sem ele, abre o GitHub Pages (treino).
      - name: Escolher o endereço que o app abre
        id: jogo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLINE_URL: ${{ vars.ONLINE_URL }}
        run: |
          servidor=$(node tools/cloudflare.mjs endereco | sed -n 's/^url=//p')
          echo "url=${servidor:-https://guibombadoida-prog.github.io/Retro-Royale/}game/index.html?platform=android" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preservar assinatura de desenvolvimento
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: retro-royale-debug-key-v1
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar aplicativo
        working-directory: android
        env:
          RR_GAME_URL: ${{ steps.jogo.outputs.url }}
        run: gradle --no-daemon assembleDebug
      - name: Verificar assinatura e preparar APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/retro-royale-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/retro-royale-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/retro-royale-android.apk > artifacts/package-info.txt
          cd artifacts
          sha256sum retro-royale-android.apk > retro-royale-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: retro-royale-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      # O botão "Baixar APK" do site e do jogo aponta para releases/download/android-latest/retro-royale-android.apk.
      - name: Publicar APK no release android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GAME_URL: ${{ steps.jogo.outputs.url }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            artifacts/retro-royale-android.apk artifacts/retro-royale-android.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Retro Royale Android (último build)" \
            --notes "APK de desenvolvimento gerado automaticamente a partir de $GITHUB_SHA. Instalação direta no Android 8 ou mais novo; não é uma versão da Play Store.

          Abre: $GAME_URL"
