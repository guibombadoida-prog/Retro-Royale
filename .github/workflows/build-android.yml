name: Retro Royale Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retro-royale-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar aplicativo
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verificar assinatura e preparar APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/retro-royale-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/retro-royale-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/retro-royale-android.apk > artifacts/package-info.txt
          cd artifacts
          sha256sum retro-royale-android.apk > retro-royale-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: retro-royale-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
